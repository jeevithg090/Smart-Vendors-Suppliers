# nginx config for serving the built SPA as a non-root user on port 8080.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable temp paths for the unprivileged user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain text/xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Fingerprinted build assets can be cached forever
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Service worker and manifest must always be revalidated
        location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Block dotfiles
        location ~ /\. {
            deny all;
        }

        # Client-side routing fallback
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
