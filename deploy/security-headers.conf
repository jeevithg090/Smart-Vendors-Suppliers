# Shared security headers. Included from every location block because nginx
# does not inherit add_header directives once a location defines its own.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Microphone and camera are used by voice queries and ingredient photo capture.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://translate.google.com https://translate.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://api.sarvam.ai https://openrouter.ai https://translation.googleapis.com https://translate.googleapis.com https://vision.googleapis.com https://api.clarifai.com https://*.cognitiveservices.azure.com; frame-src https://translate.google.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
